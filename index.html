<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>from.the.hide</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="from.the.hide">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e0e0e">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<style>
  :root {
    color-scheme: dark;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    background: #0e0e0e;
    overscroll-behavior: none;
  }

  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #999;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  #app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: #0e0e0e;
  }

  /* ---------- Header ---------- */
  .app-header {
    flex: 0 0 auto;
    padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
    padding-bottom: 10px;
    text-align: center;
  }

  .app-header span {
    font-size: 8px;
    letter-spacing: 4px;
    color: #2a2a2a;
    text-transform: lowercase;
  }

  /* ---------- Views ---------- */
  .views {
    flex: 1 1 auto;
    position: relative;
    overflow: hidden;
  }

  .view {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease;
  }

  .view.active {
    opacity: 1;
    pointer-events: auto;
  }

  /* ---------- Bottom nav ---------- */
  .bottom-nav {
    flex: 0 0 auto;
    display: flex;
    background: #131313;
    border-top: 1px solid #1e1e1e;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  .nav-btn {
    flex: 1;
    background: none;
    border: none;
    padding: 16px 0 14px;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 3px;
    color: #444;
    transition: color 0.2s ease;
  }

  .nav-btn.active {
    color: #ccc;
  }

  /* ================= LOOK TAB ================= */
  #view-look {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 28px;
    text-align: center;
    min-height: 100%;
    position: relative;
  }

  .look-body {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .look-container-text {
    font-size: 18px;
    line-height: 1.55;
    color: #999;
    max-width: 520px;
    font-weight: 300;
  }

  .look-divider {
    width: 32px;
    height: 1px;
    background: #2a2a2a;
    margin: 22px auto;
  }

  .look-attention-text {
    font-size: 14px;
    line-height: 1.55;
    color: #777;
    max-width: 460px;
    font-weight: 300;
  }

  .look-lens-suggestion {
    font-size: 10px;
    letter-spacing: 2px;
    color: #333;
    text-transform: uppercase;
    margin-top: 36px;
    min-height: 12px;
  }

  .look-goback-heading {
    font-size: 24px;
    letter-spacing: 1px;
    color: #999;
    font-weight: 300;
    margin-bottom: 22px;
  }

  .look-goback-entry {
    font-size: 18px;
    line-height: 1.55;
    color: #aaa;
    max-width: 520px;
    font-weight: 300;
    margin-bottom: 22px;
  }

  .look-goback-tagline {
    font-size: 14px;
    color: #777;
  }

  .look-next-wrap {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 24px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
  }

  .look-next {
    background: none;
    border: none;
    color: #444;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 3px;
    padding: 14px 22px;
    text-transform: lowercase;
  }

  .look-next:active {
    color: #888;
  }

  /* --- Feedback scoring --- */
  .look-feedback-row {
    display: flex;
    gap: 22px;
    margin-top: 30px;
  }

  .look-feedback-btn {
    background: none;
    border: none;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: lowercase;
    color: #444;
    padding: 8px 6px;
  }

  .look-feedback-btn:active {
    color: #888;
  }

  /* --- "Just walk today" mode --- */
  .look-justwalk-text {
    font-size: 18px;
    line-height: 1.55;
    color: #999;
    font-weight: 300;
  }

  /* --- Today's lenses link --- */
  .lens-today-wrap {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    left: 0;
    right: 0;
    text-align: center;
    z-index: 4;
  }

  .lens-today-link {
    background: none;
    border: none;
    font-family: inherit;
    font-size: 9px;
    letter-spacing: 2px;
    color: #444;
    text-transform: uppercase;
    padding: 10px;
  }

  .session-counter {
    font-size: 9px;
    letter-spacing: 1px;
    color: #333;
    margin-top: 2px;
  }

  .lens-overlay {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.75);
    padding: 24px;
  }

  .lens-overlay.active {
    display: flex;
  }

  .lens-overlay-card {
    background: #161616;
    border: 1px solid #2a2a2a;
    border-radius: 4px;
    padding: 24px 20px;
    width: 100%;
    max-width: 340px;
  }

  .lens-overlay-title {
    font-size: 9px;
    letter-spacing: 3px;
    color: #444;
    text-transform: uppercase;
    margin-bottom: 18px;
    text-align: center;
  }

  .lens-overlay-list {
    display: flex;
    flex-direction: column;
    margin-bottom: 20px;
  }

  .lens-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 6px;
    font-size: 14px;
    color: #999;
    border-bottom: 1px solid #1e1e1e;
  }

  .lens-row:last-child {
    border-bottom: none;
  }

  .lens-checkbox {
    width: 16px;
    height: 16px;
    accent-color: #666;
    flex: 0 0 auto;
  }

  .lens-overlay-done {
    width: 100%;
    background: none;
    border: 1px solid #333;
    color: #888;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 12px 0;
    border-radius: 3px;
  }

  /* --- Post-shoot "walked past" banner --- */
  .walked-banner {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 58px);
    left: 20px;
    right: 20px;
    background: #161616;
    border: 1px solid #2a2a2a;
    border-radius: 3px;
    padding: 14px 16px;
    text-align: left;
    z-index: 5;
  }

  .walked-dismiss {
    position: absolute;
    top: 6px;
    right: 8px;
    background: none;
    border: none;
    color: #444;
    font-size: 15px;
    line-height: 1;
    padding: 6px;
  }

  .walked-question {
    font-size: 12px;
    color: #888;
    margin-bottom: 10px;
    padding-right: 20px;
  }

  .walked-row {
    display: flex;
    gap: 8px;
  }

  #walked-input {
    flex: 1 1 auto;
    min-width: 0;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    color: #999;
    font-family: inherit;
    font-size: 13px;
    padding: 9px 10px;
    border-radius: 3px;
    outline: none;
  }

  #walked-input::placeholder {
    color: #555;
  }

  .walked-submit-btn {
    flex: 0 0 auto;
    background: none;
    border: 1px solid #333;
    color: #888;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 0 14px;
    border-radius: 3px;
  }

  /* ================= COLOUR TAB ================= */
  #view-colour {
    display: flex;
    flex-direction: column;
  }

  .colour-subnav {
    flex: 0 0 auto;
    display: flex;
    gap: 24px;
    padding: 16px 20px 14px;
    border-bottom: 1px solid #1a1a1a;
  }

  .subnav-btn {
    background: none;
    border: none;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 2px;
    color: #444;
    padding: 4px 0;
  }

  .subnav-btn.active {
    color: #bbb;
    border-bottom: 1px solid #555;
  }

  .colour-subview {
    display: none;
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .colour-subview.active {
    display: block;
  }

  /* --- Shades --- */
  .search-wrap {
    padding: 14px 20px 4px;
  }

  #swatch-search {
    width: 100%;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    color: #999;
    font-family: inherit;
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 3px;
    outline: none;
  }

  #swatch-search::placeholder {
    color: #555;
  }

  .family-group {
    padding: 18px 20px 4px;
  }

  .family-label {
    font-size: 11px;
    letter-spacing: 3px;
    color: #444;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .swatch-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 6px;
  }

  .swatch {
    width: 100%;
    height: 72px;
    border-radius: 2px;
    position: relative;
    display: flex;
    align-items: flex-end;
    padding: 5px 6px;
    border: none;
    font-family: inherit;
  }

  .swatch span {
    font-size: 10px;
    line-height: 1.3;
  }

  .swatch-bottom-spacer {
    height: 24px;
  }

  /* full screen swatch view */
  .swatch-full {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }

  .swatch-full.active {
    display: flex;
  }

  .swatch-full-name {
    font-size: 28px;
    letter-spacing: 1px;
    font-weight: 300;
  }

  .swatch-full-hex {
    font-size: 12px;
    letter-spacing: 2px;
    margin-top: 10px;
    opacity: 0.6;
  }

  /* --- Pairings --- */
  .pairing-card {
    margin-bottom: 30px;
  }

  .pairing-blocks {
    display: flex;
    height: 60px;
    border-radius: 2px;
    overflow: hidden;
  }

  .pairing-block {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .pairing-block span {
    font-size: 10px;
    letter-spacing: 1px;
    text-align: center;
    padding: 0 8px;
  }

  .pairing-desc {
    font-size: 12px;
    line-height: 1.75;
    color: #444;
    margin-top: 12px;
  }

  .pairing-desc div + div {
    margin-top: 6px;
  }

  /* --- Colour tab framing --- */
  .colour-framing {
    font-size: 9px;
    color: #333;
    letter-spacing: 0.5px;
    line-height: 1.6;
    padding: 16px 20px 4px;
  }

  /* --- Pairing generator --- */
  .pairing-generator {
    padding: 16px 20px calc(20px + env(safe-area-inset-bottom, 0px));
  }

  .new-pairing-btn {
    background: none;
    border: 1px solid #2a2a2a;
    color: #777;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 3px;
    padding: 12px 0;
    width: 100%;
    border-radius: 3px;
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  .new-pairing-btn:active {
    color: #aaa;
  }

  .save-pairing-btn {
    background: none;
    border: 1px solid #333;
    color: #666;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 2px;
    padding: 10px 16px;
    border-radius: 3px;
    text-transform: uppercase;
    margin-top: 16px;
  }

  .save-pairing-btn:active {
    color: #999;
  }

  .save-pairing-btn:disabled {
    opacity: 0.4;
  }

  /* --- Shade link inside LOOK prompts --- */
  .shade-link {
    text-decoration: underline;
    text-underline-offset: 3px;
    color: #bbb;
  }

  /* ================= LENS TAB ================= */
  #view-lens {
    padding: 20px 18px calc(24px + env(safe-area-inset-bottom, 0px));
  }

  .lens-card {
    background: #141414;
    border: 1px solid #1e1e1e;
    border-radius: 3px;
    padding: 20px 18px;
    margin-bottom: 14px;
  }

  .lens-name {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 12px;
  }

  .lens-desc {
    font-size: 14px;
    line-height: 1.8;
    color: #555;
  }

  /* ================= LOG TAB ================= */
  .log-input-row {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 16px 20px;
    border-bottom: 1px solid #1a1a1a;
  }

  .log-shade-wrap {
    position: relative;
  }

  #log-shade-input,
  #log-note-input {
    width: 100%;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    color: #999;
    font-family: inherit;
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 3px;
    outline: none;
  }

  #log-shade-input::placeholder,
  #log-note-input::placeholder {
    color: #555;
  }

  .log-suggestions {
    position: absolute;
    left: 0;
    right: 0;
    top: calc(100% + 2px);
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 3px;
    z-index: 10;
    max-height: 180px;
    overflow-y: auto;
    display: none;
  }

  .log-suggestions.active {
    display: block;
  }

  .log-suggestion-item {
    padding: 9px 12px;
    font-size: 13px;
    color: #999;
  }

  .log-suggestion-item:active {
    background: #2a2a2a;
  }

  .log-add-btn {
    background: none;
    border: 1px solid #333;
    color: #888;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 2px;
    padding: 11px 0;
    border-radius: 3px;
    text-transform: uppercase;
  }

  .log-add-btn:active {
    color: #ccc;
  }

  .log-list {
    padding: 4px 20px calc(20px + env(safe-area-inset-bottom, 0px));
  }

  .log-entry {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid #1a1a1a;
  }

  .log-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    flex: 0 0 auto;
  }

  .log-entry-main {
    flex: 1 1 auto;
    min-width: 0;
  }

  .log-entry-shade {
    font-size: 13px;
    color: #bbb;
  }

  .log-entry-note {
    font-size: 12px;
    color: #666;
    margin-top: 2px;
  }

  .log-entry-date {
    font-size: 10px;
    color: #444;
    flex: 0 0 auto;
    margin-left: 4px;
  }

  .log-delete-btn {
    background: none;
    border: none;
    color: #444;
    font-size: 16px;
    line-height: 1;
    padding: 4px 2px 4px 10px;
    flex: 0 0 auto;
  }

  .log-empty {
    font-size: 12px;
    color: #444;
    text-align: center;
    padding: 60px 20px;
  }
</style>
</head>
<body>

<div id="app">

  <header class="app-header"><span>from.the.hide</span></header>

  <div class="views">

    <!-- ============ LOOK ============ -->
    <section id="view-look" class="view active">
      <div class="lens-today-wrap">
        <button class="lens-today-link" id="lens-today-link">TODAY'S LENSES</button>
        <div class="session-counter" id="session-counter"></div>
      </div>

      <div class="walked-banner" id="walked-banner" style="display:none">
        <button class="walked-dismiss" id="walked-dismiss-btn">&times;</button>
        <div class="walked-question">What did you walk past?</div>
        <div class="walked-row">
          <input type="text" id="walked-input" placeholder="in a few words" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
          <button class="walked-submit-btn" id="walked-submit-btn">log it</button>
        </div>
      </div>

      <div class="look-body" id="look-body"></div>

      <div class="look-next-wrap">
        <button class="look-next" id="look-next-btn">random</button>
        <button class="look-next" id="just-walk-btn">just walk today</button>
      </div>
    </section>

    <!-- ============ COLOUR ============ -->
    <section id="view-colour" class="view">
      <div class="colour-framing">STUDY, NOT A SHOOTING LIST — BUILD THE EYE BEFORE YOU GO OUT.</div>

      <nav class="colour-subnav">
        <button class="subnav-btn active" data-subview="shades">SHADES</button>
        <button class="subnav-btn" data-subview="pairings">PAIRINGS</button>
      </nav>

      <div id="subview-shades" class="colour-subview active">
        <div class="search-wrap">
          <input type="text" id="swatch-search" placeholder="search colours" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        </div>
        <div id="swatch-groups"></div>
        <div class="swatch-bottom-spacer"></div>
      </div>

      <div id="subview-pairings" class="colour-subview">
        <div class="pairing-generator">
          <button class="new-pairing-btn" id="new-pairing-btn">NEW PAIRING</button>
          <div id="pairing-result"></div>
        </div>
      </div>
    </section>

    <!-- ============ LENS ============ -->
    <section id="view-lens" class="view">
      <div id="lens-list"></div>
    </section>

    <!-- ============ LOG ============ -->
    <section id="view-log" class="view">
      <div class="log-input-row">
        <div class="log-shade-wrap">
          <input type="text" id="log-shade-input" placeholder="shade" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
          <div class="log-suggestions" id="log-suggestions"></div>
        </div>
        <input type="text" id="log-note-input" placeholder="where / what" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button class="log-add-btn" id="log-add-btn">ADD</button>
      </div>
      <div class="log-list" id="log-list"></div>
    </section>

  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="look">LOOK</button>
    <button class="nav-btn" data-view="colour">COLOUR</button>
    <button class="nav-btn" data-view="lens">LENS</button>
    <button class="nav-btn" data-view="log">LOG</button>
  </nav>

</div>

<div class="swatch-full" id="swatch-full">
  <div class="swatch-full-name" id="swatch-full-name"></div>
  <div class="swatch-full-hex" id="swatch-full-hex"></div>
</div>

<div class="lens-overlay" id="lens-overlay">
  <div class="lens-overlay-card">
    <div class="lens-overlay-title">TODAY'S LENSES</div>
    <div class="lens-overlay-list" id="lens-overlay-list"></div>
    <button class="lens-overlay-done" id="lens-overlay-done-btn">done</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ======================================================
     DATA
     ====================================================== */

  var CONTAINERS = [
    { text: "Whatever you shoot first, shoot again in an hour.", pace: "any", axis: "rhythm" },
    { text: "Walk until you're bored, then start.", pace: "any", axis: "rhythm" },
    { text: "No frame without a reflection in it.", pace: "any", axis: "optical" },
    { text: "Photograph nothing you already know the name of.", pace: "any", axis: "perception" },
    { text: "No frame without weather in it somewhere.", pace: "any", axis: "light" },
    { text: "Photograph something you'd normally step around.", pace: "any", axis: "trace" },
    { text: "Photograph before you understand what you're looking at.", pace: "any", axis: "perception" },
    { text: "Cross a threshold before you shoot \u2014 a step, a gate, a doorway.", pace: "any", axis: "space" },
    { text: "Photograph what a queue is waiting for, not the queue itself.", pace: "any", axis: "distance" },
    { text: "Photograph only what's in someone else's eyeline, not yours.", pace: "any", axis: "gesture" },
    { text: "Don't shoot the busiest thing in view \u2014 shoot what's next to it.", pace: "any", axis: "distance" },
    { text: "No frame unless you can hear something you can't see.", pace: "any", axis: "distance" },
    { text: "No shot until you've said no to three easier ones.", pace: "any", axis: "gesture" },
    { text: "Let a stopped clock or a dead sign choose your subject.", pace: "any", axis: "trace" },
    { text: "Find the thing that would only make sense to someone who lives here.", pace: "any", axis: "trace" },
    { text: "Return to the last place that disappointed you.", pace: "any", axis: "rhythm" },
    { text: "Photograph what's been repaired badly.", pace: "any", axis: "trace" },
    { text: "Photograph the gap between two things, not the things.", pace: "any", axis: "distance" },
    { text: "Find the thing so common it stopped being counted.", pace: "any", axis: "trace" },

  function hexToRgb(hex) {
    var h = hex.replace("#", "");
    return {
      r: parseInt(h.substring(0, 2), 16),
      g: parseInt(h.substring(2, 4), 16),
      b: parseInt(h.substring(4, 6), 16)
    };
  }

  function relLuminance(hex) {
    var c = hexToRgb(hex);
    function lin(v) {
      v = v / 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    }
    return 0.2126 * lin(c.r) + 0.7152 * lin(c.g) + 0.0722 * lin(c.b);
  }

  function labelColour(hex) {
    return relLuminance(hex) > 0.45 ? "#111" : "#eee";
  }

  function hexToHsl(hex) {
    var c = hexToRgb(hex);
    var r = c.r / 255, g = c.g / 255, b = c.b / 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b);
    var h = 0, s = 0, l = (max + min) / 2;
    if (max !== min) {
      var d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      switch (max) {
        case r: h = (g - b) / d + (g < b ? 6 : 0); break;
        case g: h = (b - r) / d + 2; break;
        case b: h = (r - g) / d + 4; break;
      }
      h *= 60;
    }
    return { h: h, s: s, l: l };
  }

  function tempCategory(hex) {
    var h = hexToHsl(hex).h;
    if (h < 60 || h >= 300) return "warm";
    if (h >= 180 && h < 300) return "cool";
    return "neutral";
  }

  function perceivedLuminance(hex) {
    var c = hexToRgb(hex);
    return 0.299 * c.r + 0.587 * c.g + 0.114 * c.b;
  }

  function temperatureStatement(hexA, hexB) {
    var a = tempCategory(hexA), b = tempCategory(hexB);
    if (a === "warm" && b === "warm") return "Two warms, different intensities";
    if (a === "cool" && b === "cool") return "Two cools, different depths";
    if ((a === "warm" && b === "cool") || (a === "cool" && b === "warm")) return "Warm meeting cool";
    if (a === "neutral" && b === "neutral") return "Two neutrals, transitional territory";
    var other = a === "neutral" ? b : a;
    return other === "warm" ? "A neutral meeting warm" : "A neutral meeting cool";
  }

  /*
   * Fixed 15/40 luminance thresholds skewed nearly 70% of random pairs into
   * "strong separation" — this list runs from ~10 (Pitch) to ~253 (Snow) with
   * more very-dark/very-light shades than mid-toned ones. Thresholds are
   * instead derived from the actual pairwise distribution across the current
   * shade list, so the three brightness categories stay roughly equally likely.
   */
  var BRIGHTNESS_THRESHOLDS = (function () {
    var diffs = [];
    for (var i = 0; i < ALL_SHADES.length; i++) {
      for (var j = i + 1; j < ALL_SHADES.length; j++) {
        diffs.push(Math.abs(perceivedLuminance(ALL_SHADES[i].hex) - perceivedLuminance(ALL_SHADES[j].hex)));
      }
    }
    diffs.sort(function (a, b) { return a - b; });
    return {
      low: diffs[Math.floor(diffs.length / 3)],
      high: diffs[Math.floor(diffs.length * 2 / 3)]
    };
  })();

  function brightnessStatement(hexA, hexB) {
    var diff = Math.abs(perceivedLuminance(hexA) - perceivedLuminance(hexB));
    if (diff < BRIGHTNESS_THRESHOLDS.low) return "Very close in brightness — watch for the edge to soften";
    if (diff <= BRIGHTNESS_THRESHOLDS.high) return "Some separation — a little depth between them";
    return "Strong separation — real depth, no ambiguity";
  }

  function weightedRandomPick(items, getText) {
    var scores = loadPromptScores();
    var weights = items.map(function (item) {

    });
    var total = weights.reduce(function (a, b) { return a + b; }, 0);
    var r = Math.random() * total;
    for (var i = 0; i < items.length; i++) {
      r -= weights[i];
      if (r <= 0) return items[i];
    }
    return items[items.length - 1];
  }

      if (entry) {
        entry.returned = true;
        saveLogEntries(logEntries);
        saveLastReturnTs(Date.now());
        renderGoBack(entry);
        return;
      }
    }
    renderWheelPair();
  }

  lookNextBtn.addEventListener("click", function () {
    renderWheelPair();
    ensureWakeLockForLook();
  });

  var justWalkBtn = document.getElementById("just-walk-btn");
  justWalkBtn.addEventListener("click", function () {
    renderJustWalk();
    ensureWakeLockForLook();
  });

  lookBodyEl.addEventListener("click", function (e) {
    var shadeTarget = e.target.closest ? e.target.closest(".shade-link") : null;
    if (shadeTarget) {
      var shade = SHADE_BY_NAME[shadeTarget.dataset.shade];
      if (shade) goToShadeInColour(shade.name, shade.hex);
      return;
    }
    if (e.target.id === "feedback-keep-btn") {
      applyFeedback(true);
      return;
    }
    if (e.target.id === "feedback-skip-btn") {
      applyFeedback(false);
      return;
    }
  });

  /* swipe up anywhere on the LOOK screen shuffles too */
  (function () {
    var startX = 0, startY = 0, startT = 0, tracking = false;

    lookViewEl.addEventListener("touchstart", function (e) {
      if (e.touches.length !== 1) return;
      tracking = true;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      startT = Date.now();
    }, { passive: true });

    lookViewEl.addEventListener("touchend", function (e) {
      if (!tracking) return;
      tracking = false;
      var touch = e.changedTouches[0];
      if (!touch) return;
      var dx = touch.clientX - startX;
      var dy = touch.clientY - startY;
      var dt = Date.now() - startT;
      if (dy < -50 && Math.abs(dx) < 60 && dt < 800) {
        renderWheelPair();
        ensureWakeLockForLook();
      }
    }, { passive: true });
  })();

  /* ======================================================
     COLOUR TAB — SHADES
     ====================================================== */

  var swatchGroupsEl = document.getElementById("swatch-groups");
  var swatchSearchEl = document.getElementById("swatch-search");
  var swatchFullEl = document.getElementById("swatch-full");
  var swatchFullNameEl = document.getElementById("swatch-full-name");
  var swatchFullHexEl = document.getElementById("swatch-full-hex");

  function renderSwatches(filter) {
    filter = (filter || "").trim().toLowerCase();
    swatchGroupsEl.innerHTML = "";

    FAMILIES.forEach(function (family) {
      var matches = family.colours.filter(function (c) {
        return !filter || c[0].toLowerCase().indexOf(filter) !== -1;
      });
      if (matches.length === 0) return;

      var groupEl = document.createElement("div");
      groupEl.className = "family-group";

      var labelEl = document.createElement("div");
      labelEl.className = "family-label";
      labelEl.textContent = family.name;
      groupEl.appendChild(labelEl);

      var gridEl = document.createElement("div");
      gridEl.className = "swatch-grid";

      matches.forEach(function (c) {
        var name = c[0], hex = c[1];
        var sw = document.createElement("button");
        sw.className = "swatch";
        sw.style.background = hex;
        var labelColourVal = labelColour(hex);
        sw.innerHTML = '<span style="color:' + labelColourVal + '">' + name + "</span>";
        sw.addEventListener("click", function () {
          openFullSwatch(name, hex);
        });
        gridEl.appendChild(sw);
      });

      groupEl.appendChild(gridEl);
      swatchGroupsEl.appendChild(groupEl);
    });
  }

  function openFullSwatch(name, hex) {
    swatchFullEl.style.background = hex;
    var textColour = labelColour(hex);
    swatchFullNameEl.style.color = textColour;
    swatchFullHexEl.style.color = textColour;
    swatchFullNameEl.textContent = name;
    swatchFullHexEl.textContent = hex.toUpperCase();
    swatchFullEl.classList.add("active");
  }

  swatchFullEl.addEventListener("click", function () {
    swatchFullEl.classList.remove("active");
  });

  swatchSearchEl.addEventListener("input", function () {
    renderSwatches(swatchSearchEl.value);
  });

  renderSwatches("");

  /* ======================================================
     COLOUR TAB — PAIRINGS (generator)
     ====================================================== */

  var newPairingBtn = document.getElementById("new-pairing-btn");
  var pairingResultEl = document.getElementById("pairing-result");
  var currentGeneratedPairing = null;

  function generatePairing() {
    var i = Math.floor(Math.random() * ALL_SHADES.length);
    var j;
    do {
      j = Math.floor(Math.random() * ALL_SHADES.length);
    } while (j === i);
    currentGeneratedPairing = { a: ALL_SHADES[i], b: ALL_SHADES[j] };
    renderGeneratedPairing();
  }

  function renderGeneratedPairing() {
    pairingResultEl.innerHTML = "";
    if (!currentGeneratedPairing) return;
    var p = currentGeneratedPairing;

    var card = document.createElement("div");
    card.className = "pairing-card";

    var blocks = document.createElement("div");
    blocks.className = "pairing-blocks";
    [p.a, p.b].forEach(function (item) {
      var block = document.createElement("div");
      block.className = "pairing-block";
      block.style.background = item.hex;
      var span = document.createElement("span");
      span.style.color = labelColour(item.hex);
      span.textContent = item.name;
      block.appendChild(span);
      blocks.appendChild(block);
    });

    var analysis = document.createElement("div");
    analysis.className = "pairing-desc";
    var tempLine = document.createElement("div");
    tempLine.textContent = temperatureStatement(p.a.hex, p.b.hex);
    var brightLine = document.createElement("div");
    brightLine.textContent = brightnessStatement(p.a.hex, p.b.hex);
    analysis.appendChild(tempLine);
    analysis.appendChild(brightLine);

    var saveBtn = document.createElement("button");
    saveBtn.className = "save-pairing-btn";
    saveBtn.textContent = "SAVE THIS PAIRING";
    saveBtn.addEventListener("click", function () {
      addLogEntry(p.a.name + " + " + p.b.name, "saved pairing");
      saveBtn.textContent = "SAVED";
      saveBtn.disabled = true;
    });

    card.appendChild(blocks);
    card.appendChild(analysis);
    card.appendChild(saveBtn);
    pairingResultEl.appendChild(card);
  }

  newPairingBtn.addEventListener("click", generatePairing);

  generatePairing();

  /* ======================================================
     COLOUR TAB — sub-nav switching
     ====================================================== */

  var subnavBtns = document.querySelectorAll(".subnav-btn");
  var subviews = {
    shades: document.getElementById("subview-shades"),
    pairings: document.getElementById("subview-pairings")
  };

  function switchColourSubview(key) {
    subnavBtns.forEach(function (b) {
      b.classList.toggle("active", b.dataset.subview === key);
    });
    Object.keys(subviews).forEach(function (k) {
      subviews[k].classList.toggle("active", k === key);
    });
  }

  subnavBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      switchColourSubview(btn.dataset.subview);
    });
  });

  /* ======================================================
     LENS TAB
     ====================================================== */

  var lensListEl = document.getElementById("lens-list");

  function renderLenses() {
    lensListEl.innerHTML = "";
    LENSES.forEach(function (lens) {
      var card = document.createElement("div");
      card.className = "lens-card";

      var name = document.createElement("div");
      name.className = "lens-name";
      name.textContent = lens.name;

      var desc = document.createElement("div");
      desc.className = "lens-desc";
      desc.textContent = lens.desc;

      card.appendChild(name);
      card.appendChild(desc);
      lensListEl.appendChild(card);
    });
  }

  renderLenses();

  /* ======================================================
     BOTTOM NAV — tab switching
     ====================================================== */

  var navBtns = document.querySelectorAll(".nav-btn");
  var views = {
    look: document.getElementById("view-look"),
    colour: document.getElementById("view-colour"),
    lens: document.getElementById("view-lens"),
    log: document.getElementById("view-log")
  };
  var currentView = "look";

  function switchView(key) {
    navBtns.forEach(function (b) {
      b.classList.toggle("active", b.dataset.view === key);
    });
    currentView = key;
    Object.keys(views).forEach(function (k) {
      views[k].classList.toggle("active", k === currentView);
    });
    if (currentView === "look") {
      ensureWakeLockForLook();
    } else {
      releaseWakeLock();
    }
  }

  navBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      switchView(btn.dataset.view);
    });
  });

  function goToShadeInColour(name, hex) {
    switchView("colour");
    switchColourSubview("shades");
    openFullSwatch(name, hex);
  }

  /* ======================================================
     WAKE LOCK — keep the screen on while reading a prompt
     ====================================================== */

  var wakeLock = null;

  function ensureWakeLockForLook() {
    if (currentView !== "look") return;
    if (!("wakeLock" in navigator)) return;
    if (wakeLock) return;
    navigator.wakeLock.request("screen").then(function (lock) {
      wakeLock = lock;
      wakeLock.addEventListener("release", function () {
        wakeLock = null;
      });
    }).catch(function () {});
  }

  function releaseWakeLock() {
    if (wakeLock) {
      wakeLock.release().catch(function () {});
      wakeLock = null;
    }
  }

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && currentView === "look") {
      ensureWakeLockForLook();
    }
  });

  ensureWakeLockForLook();

  /* ======================================================
     FIELD LOG
     ====================================================== */

  var LOG_KEY = "fth-fieldlog";
  var MONTH_NAMES = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  function loadLogEntries() {
    try {
      var raw = localStorage.getItem(LOG_KEY);
      if (raw === null) return [];
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  function saveLogEntries(entries) {
    try {
      localStorage.setItem(LOG_KEY, JSON.stringify(entries));
    } catch (e) {}
  }

  var logEntries = loadLogEntries();

  function addLogEntry(shade, note) {
    logEntries.push({ shade: shade || null, note: note, timestamp: Date.now(), returned: false });
    saveLogEntries(logEntries);
    renderLog();
  }

  /* ---- weekly "go back" mechanic ---- */
  var RETURN_KEY = "fth-last-return";
  var WEEK_MS = 7 * 24 * 60 * 60 * 1000;

  function loadLastReturnTs() {
    try {
      var raw = localStorage.getItem(RETURN_KEY);
      if (raw === null) return 0;
      var n = parseInt(raw, 10);
      return isNaN(n) ? 0 : n;
    } catch (e) {
      return 0;
    }
  }

  function saveLastReturnTs(ts) {
    try {
      localStorage.setItem(RETURN_KEY, String(ts));
    } catch (e) {}
  }

  function isWeeklyReturnDue() {
    return (Date.now() - loadLastReturnTs()) >= WEEK_MS;
  }

  function pickReturnEntry() {
    if (logEntries.length === 0) return null;
    var unreturned = logEntries.filter(function (e) { return !e.returned; });
    if (unreturned.length === 0) {
      /* full cycle complete — recycle everything */
      logEntries.forEach(function (e) { e.returned = false; });
      saveLogEntries(logEntries);
      unreturned = logEntries.slice();
    }
    unreturned.sort(function (a, b) { return a.timestamp - b.timestamp; });
    return unreturned[0];
  }

  /* ---- post-shoot "what did you walk past" banner ---- */
  var walkedBannerEl = document.getElementById("walked-banner");
  var walkedInputEl = document.getElementById("walked-input");
  var walkedSubmitBtn = document.getElementById("walked-submit-btn");
  var walkedDismissBtn = document.getElementById("walked-dismiss-btn");
  var SIX_HOURS_MS = 6 * 60 * 60 * 1000;

  function checkWalkedPastBanner() {
    if (logEntries.length === 0) {
      walkedBannerEl.style.display = "none";
      return;
    }
    var mostRecentTs = Math.max.apply(null, logEntries.map(function (e) { return e.timestamp; }));
    walkedBannerEl.style.display = (Date.now() - mostRecentTs <= SIX_HOURS_MS) ? "" : "none";
  }

  walkedDismissBtn.addEventListener("click", function () {
    walkedBannerEl.style.display = "none";
  });

  function submitWalkedPast() {
    var val = walkedInputEl.value.trim();
    if (!val) return;
    addLogEntry(null, "[walked past] " + val);
    walkedInputEl.value = "";
    walkedBannerEl.style.display = "none";
  }

  walkedSubmitBtn.addEventListener("click", submitWalkedPast);
  walkedInputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter") submitWalkedPast();
  });

  function formatLogDate(ts) {
    var d = new Date(ts);
    return d.getDate() + " " + MONTH_NAMES[d.getMonth()];
  }

  var logListEl = document.getElementById("log-list");

  function renderLog() {
    logListEl.innerHTML = "";

    if (logEntries.length === 0) {
      var empty = document.createElement("div");
      empty.className = "log-empty";
      empty.textContent = "Nothing logged yet.";
      logListEl.appendChild(empty);
      return;
    }

    var sorted = logEntries.slice().sort(function (a, b) {
      return b.timestamp - a.timestamp;
    });

    sorted.forEach(function (entry) {
      var row = document.createElement("div");
      row.className = "log-entry";

      if (entry.shade) {
        var dot = document.createElement("div");
        dot.className = "log-dot";
        var known = SHADE_BY_NAME[entry.shade];
        dot.style.background = known ? known.hex : "#333";
        row.appendChild(dot);
      }

      var main = document.createElement("div");
      main.className = "log-entry-main";
      if (entry.shade) {
        var shadeEl = document.createElement("div");
        shadeEl.className = "log-entry-shade";
        shadeEl.textContent = entry.shade;
        main.appendChild(shadeEl);
      }
      if (entry.note) {
        var noteEl = document.createElement("div");
        noteEl.className = "log-entry-note";
        noteEl.textContent = entry.note;
        main.appendChild(noteEl);
      }

      var dateEl = document.createElement("div");
      dateEl.className = "log-entry-date";
      dateEl.textContent = formatLogDate(entry.timestamp);

      var delBtn = document.createElement("button");
      delBtn.className = "log-delete-btn";
      delBtn.textContent = "×";
      delBtn.addEventListener("click", function () {
        var idx = logEntries.indexOf(entry);
        if (idx !== -1) {
          logEntries.splice(idx, 1);
          saveLogEntries(logEntries);
          renderLog();
        }
      });

      row.appendChild(main);
      row.appendChild(dateEl);
      row.appendChild(delBtn);
      logListEl.appendChild(row);
    });
  }

  renderLog();
  checkWalkedPastBanner();
  renderLookInitial();

  var logShadeInput = document.getElementById("log-shade-input");
  var logNoteInput = document.getElementById("log-note-input");
  var logSuggestionsEl = document.getElementById("log-suggestions");
  var logAddBtn = document.getElementById("log-add-btn");

  function renderShadeSuggestions(query) {
    query = query.trim().toLowerCase();
    logSuggestionsEl.innerHTML = "";
    if (!query) {
      logSuggestionsEl.classList.remove("active");
      return;
    }
    var matches = ALL_SHADES.filter(function (s) {
      return s.name.toLowerCase().indexOf(query) !== -1;
    }).slice(0, 6);
    if (matches.length === 0) {
      logSuggestionsEl.classList.remove("active");
      return;
    }
    matches.forEach(function (s) {
      var item = document.createElement("div");
      item.className = "log-suggestion-item";
      item.textContent = s.name;
      item.addEventListener("click", function () {
        logShadeInput.value = s.name;
        logSuggestionsEl.classList.remove("active");
      });
      logSuggestionsEl.appendChild(item);
    });
    logSuggestionsEl.classList.add("active");
  }

  logShadeInput.addEventListener("input", function () {
    renderShadeSuggestions(logShadeInput.value);
  });

  logShadeInput.addEventListener("blur", function () {
    setTimeout(function () {
      logSuggestionsEl.classList.remove("active");
    }, 150);
  });

  logAddBtn.addEventListener("click", function () {
    var shadeVal = logShadeInput.value.trim();
    var noteVal = logNoteInput.value.trim();
    if (!shadeVal) return;
    addLogEntry(shadeVal, noteVal);
    logShadeInput.value = "";
    logNoteInput.value = "";
    logSuggestionsEl.classList.remove("active");
  });

  /* ======================================================
     SERVICE WORKER
     ====================================================== */

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }

})();
</script>

</body>
</html>
